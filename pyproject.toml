[project]
name = "escritab"
version = "1.0.0"
description = "Suno / audio -> multi-instrument MIDI (Dettato) -> guitar tablature"
# 3.11 only: the optional legacy engine (basic-pitch) needs TensorFlow 2.15, which has no newer wheels
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "pretty_midi>=0.2.10",
    "pyguitarpro>=0.9.3",
    "torch>=2.6",
    "demucs>=4.0.1",
    # Multi-instrument transcription (Apache-2.0; pinned commit, no PyPI release yet)
    "dettato",
    "hf_xet>=1.0",  # faster Hugging Face downloads of the Dettato weights
    "openai-whisper>=20250625",
    "torchcrepe>=0.0.24",
    "bs-roformer>=1.4.1",
]

[project.optional-dependencies]
# Legacy single-stem engine (pulls TensorFlow 2.15, CPU-only on Windows). Without it the
# "basic_pitch" engine falls back to librosa pYIN.  uv sync --extra legacy
legacy = ["basic-pitch>=0.3.0"]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.uv]
package = false

[tool.uv.sources]
dettato = { git = "https://github.com/kobimusic/dettato", rev = "9b724251794f2bbd5eaa43e54734e5a251829130" }
# CUDA 12.8 build of PyTorch on Windows/Linux (RTX 30xx+); macOS keeps the default PyPI wheel
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
